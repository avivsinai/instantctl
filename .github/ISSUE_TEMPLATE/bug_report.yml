name: Bug report
description: Report a reproducible problem with instantctl.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Share only sanitized output. Remove tokens, email addresses, site identifiers, IP addresses, and other private data.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect the command to do?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the command and sanitized output. Do not include credentials.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: instantctl version
      placeholder: instantctl 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux
        - Other
    validations:
      required: true
