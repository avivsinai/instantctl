[workspace]
members = ["crates/instantctl-api", "crates/instantctl", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/avivsinai/instantctl"
homepage = "https://github.com/avivsinai/instantctl"

[workspace.dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive", "env", "wrap_help", "string"] }
clap_complete = "=4.6.11"
clap_mangen = "=0.3.3"
rpassword = "=7.5.4"
comfy-table = "=8.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
serde_yaml_ng = "=0.10.0"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["rt", "macros", "time", "sync"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "gzip", "form"] }
url = "=2.5.8"
roxmltree = "=0.21.1"
base64 = "=0.23.1"
getrandom = "=0.4.3"
jiff = { version = "=0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
sha2 = "=0.11.0"
keyring-core = "=1.0.0"
libc = "=0.2.190"
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }
instantctl-api = { path = "crates/instantctl-api" }
instantctl = { path = "crates/instantctl" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
